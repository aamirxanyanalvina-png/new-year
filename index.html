<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ახალ წლამდე დარჩენილი დრო</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="countdown-container">
        <h1>🎄 ახალ წლამდე დარჩენილია 🎆</h1>
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <p>დღე</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>საათი</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>წუთი</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>წამი</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
